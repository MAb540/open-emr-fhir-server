# Test-scope configuration.
#
# This file REPLACES src/main/resources/application.yaml on the test classpath
# (Spring Boot takes the first classpath:/application.yaml it finds, it does not
# merge the two), so it has to be self-contained.
#
# It exists so parallel agent sessions running `mvn test` in separate git
# worktrees cannot collide:
#
#   - JobRunr's background job server is off. Otherwise a test run starts a job
#     server against the shared OpenEMR database and competes with every other
#     agent (and with the running app) for jobs.
#   - JobRunr's dashboard is off. Otherwise a test run binds port 8000, and a
#     second concurrent run fails to start.
#
# The datasource is still pointed at the shared OpenEMR database because the
# Spring context opens a connection eagerly (Hikari validates on startup, and
# Hibernate needs JDBC metadata to resolve the dialect). The context load only
# reads: ddl-auto is none and SQL init is skipped for a non-embedded database.
#
# The Testcontainers integration test is unaffected: @ServiceConnection on the
# MariaDBContainer overrides spring.datasource.url, so it still gets its own
# container.
spring:
  application:
    name: basic-fhir-server

  datasource:
    url: jdbc:mariadb://localhost:8320/openemr
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: false
